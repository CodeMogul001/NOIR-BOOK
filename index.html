    <script>
      (function() {
        // Defensive patch for browser extensions (such as Zerion wallet) attempting to redefine non-configurable properties
        try {
          const originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            try {
              if (descriptor && typeof descriptor === 'object' && descriptor.configurable === undefined) {
                descriptor.configurable = true;
              }
              return originalDefineProperty.call(Object, obj, prop, descriptor);
            } catch (err) {
              if (
                prop === 'isZerion' ||
                prop === 'ethereum' ||
                (err && typeof err.message === 'string' && (err.message.includes('isZerion') || err.message.includes('Cannot redefine property')))
              ) {
                try {
                  if (obj && descriptor && 'value' in descriptor) {
                    obj[prop] = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
              throw err;
            }
          };
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            (event.message.includes('isZerion') || event.message.includes('Cannot redefine property'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event &&
            event.reason &&
            event.reason.message &&
            (event.reason.message.includes('isZerion') || event.reason.message.includes('Cannot redefine property'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
